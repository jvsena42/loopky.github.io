name: Checks and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pages needs these; nothing else in the workflow writes.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push wins, but never cancels a deploy that is already halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Parses every script, checks the eleven dictionaries against each other and
      # against the page, and verifies the assets and sitemap. No dependencies.
      - name: Check
        run: node tools/check.mjs

      # Loads the page in the runner's Chrome and fails if it scrolls sideways.
      # A cropped screenshot of an overflowing page looks exactly like a cropped
      # screenshot of a correct one, which is how one shipped.
      - name: Layout
        run: node tools/layout-check.mjs

      # The indexer is public and read-only, so this asks it the same two questions
      # the page does. A warning and not a failure: the network being down is not a
      # reason to block a deploy, but it is worth seeing in the log.
      - name: Is the Discover feed answering?
        continue-on-error: true
        run: |
          set -o pipefail
          decks=$(curl -fsS --max-time 20 \
            'https://nexus.pubky.app/v0/stream/resources?app=loopky&tags=loopky-deck&sorting=taggers_count&limit=50&skip=0' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
          posts=$(curl -fsS --max-time 20 \
            'https://nexus.pubky.app/v0/stream/posts?tags=loopky-deck&sorting=timeline&limit=30&skip=0' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')
          echo "Nexus: $decks deck manifests, $posts announcement posts."
          [ "$decks" -gt 0 ] || echo "::warning::No deck manifests came back. Discover will show its error state."

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history, so the IndexNow step can see what this push changed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # enablement turns Pages on the first time, so the repository needs no
      # click in Settings before the first deploy can land.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The repository is the site. There is nothing to build. v3 keeps dotfiles in
      # the artifact, which is what publishes .well-known/assetlinks.json; v4 drops
      # them unless the step sets include-hidden-files, and tools/check.mjs says so.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      # Tells Bing and the other IndexNow engines which pages changed, once they are
      # live. A warning at worst: a slow search engine is no reason to fail a deploy.
      - name: Announce changed pages (IndexNow)
        continue-on-error: true
        run: node tools/indexnow.mjs "${{ github.event.before }}"
